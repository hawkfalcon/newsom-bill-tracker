name: Refresh bill data

on:
  schedule:
    # Strategic timing tailored to the California Governor's signing window
    # and LegInfo update cycles (California Pacific Daylight Time / PDT is UTC-7):
    #
    # Peak drop window: Hourly from 1:17pm to 12:17am PT (20:17 to 07:17 UTC)
    #   Batch signing and veto announcements historically drop between 4pm-9pm PT
    #   (e.g., the 9/14 batch dropped at 8:02pm PT), with potential midnight drops
    #   approaching the Sept 30 constitutional deadline. Hourly runs ensure drops are
    #   caught within ~1 hour rather than waiting until the next morning.
    #
    # Morning / Midday checks: 6:17am, 8:17am, 10:17am, 12:17pm PT (13:17, 15:17, 17:17, 19:17 UTC)
    #   Captures overnight LegInfo chaptering syncs and daytime announcements.
    #
    # Minute :17 avoids GitHub Actions top-of-hour scheduler queue backlogs.
    - cron: "17 0,1,2,3,4,5,6,7,13,15,17,19,20,21,22,23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Keep a manual enrichment run on the feature branch from being cancelled by
# the separately scheduled refresh on master.
concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch bills from LegInfo
        run: python scripts/fetch_bills.py --out data/bills.json --ai-source data/.bill_digest_cache.json

      - name: Enrich explanations with Gemini (optional offline batch)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # These can be overridden without changing the code. The script
          # rotates batches across models and falls back if one is unavailable.
          GEMINI_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash-lite
        run: python scripts/gemini_enrichment.py --data data/bills.json --source data/.bill_digest_cache.json

      - name: Fetch Governor's office announcements
        run: python scripts/fetch_gov_updates.py --out data/gov_actions.json

      - name: Build static site
        run: python scripts/build_site.py --data data/bills.json --gov data/gov_actions.json --template site/template.html --out index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bills.json data/gov_actions.json data/leginfo_cache.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh bill data ($(date -u +%Y-%m-%d))"
            git pull --rebase origin "${GITHUB_REF#refs/heads/}" || true
            git push
          fi
